---
- name: Provision OpenFHE + LSSVM runtime
  hosts: fhe
  become: true

  vars:
    openfhe_version: v1.5.1
    repo_root: "{{ playbook_dir }}/../.."
    app_dir: /opt/lssvm/app
    venv_dir: /opt/lssvm/venv
    build_dir: /opt/build/openfhe
    openfhe_repo: https://github.com/openfheorg/openfhe-development.git
    app_user: "{{ ansible_user }}"
    app_group: "{{ ansible_user }}"
    # Build deps, listed once — used both to verify the apt index is complete
    # (below) and to install. libomp-dev/python3-pip live in `universe`, so the
    # index check must cover them, not just a `main` package.
    apt_packages:
      - build-essential
      - cmake
      - git
      - libssl-dev
      - libomp-dev
      - autoconf
      - python3-dev
      - python3-pip
      - python3-venv
      - rsync
      - pkg-config

  tasks:
    - name: Wait for apt lock to clear (cloud-init may still be running)
      ansible.builtin.shell: |
        while fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; do sleep 5; done
      changed_when: false

    # `apt-get update` exits 0 even when some indices fail to fetch, so on a fresh
    # instance a whole pocket (jammy/main OR jammy/universe) can be missing while
    # update "succeeds" — which later makes a package unresolvable. Trust the
    # *result*, not the exit code: re-run update until EVERY build dep (across main
    # AND universe) actually resolves, so "Install build deps" can't fail.
    - name: Refresh apt cache until all build deps resolve (first-boot indices arrive partial)
      ansible.builtin.shell: |
        apt-get update
        for p in {{ apt_packages | join(' ') }}; do
          apt-cache policy "$p" | grep -q 'Candidate: [0-9]' || exit 1
        done
      args:
        executable: /bin/bash
      register: apt_ready
      changed_when: true
      retries: 12
      delay: 15
      until: apt_ready.rc == 0

    - name: Install build deps
      ansible.builtin.apt:
        name: "{{ apt_packages }}"
        state: present

    - name: Clone OpenFHE source
      ansible.builtin.git:
        repo: "{{ openfhe_repo }}"
        dest: "{{ build_dir }}"
        version: "{{ openfhe_version }}"
        depth: 1
        force: true

    - name: Configure OpenFHE build
      # WITH_NATIVEOPT=ON compiles with -march=native so the NTT inner loops use the
      # host's SIMD (NEON on Ampere A1, AVX on x86) — safe on a build-and-run-same-host node.
      # WITH_OPENMP=ON is REQUIRED for parallelism: without it OpenFHE runs single-threaded
      # (every #pragma omp becomes num_threads(1)) and FHE workers ride ~1 core. It is
      # nominally OpenFHE's default, but find_package(OpenMP) can silently fail on ARM —
      # hence the explicit flag AND the linkage assertion below (2026-07-29 regression).
      ansible.builtin.command:
        cmd: cmake -S {{ build_dir }} -B {{ build_dir }}/build -DBUILD_UNITTESTS=OFF -DBUILD_EXAMPLES=OFF -DBUILD_BENCHMARKS=OFF -DCMAKE_BUILD_TYPE=Release -DWITH_NATIVEOPT=ON -DWITH_OPENMP=ON
        creates: "{{ build_dir }}/build/Makefile"

    - name: Compile OpenFHE
      community.general.make:
        chdir: "{{ build_dir }}/build"
        jobs: "{{ ansible_processor_vcpus | default(2) }}"

    - name: Install OpenFHE
      community.general.make:
        chdir: "{{ build_dir }}/build"
        target: install

    - name: Refresh linker cache
      ansible.builtin.command: ldconfig
      changed_when: false

    - name: Assert OpenFHE was built WITH OpenMP (guards the serial-build regression)
      # A serial build (WITH_OPENMP=OFF / find_package(OpenMP) failed) links no libgomp and
      # defines no -DPARALLEL, so every #pragma omp runs num_threads(1) -> FHE workers use
      # ~1 core. Discriminators that actually hold: the PKE lib links libgomp, has GOMP/omp
      # symbols, and CMakeCache shows WITH_OPENMP=ON. (This is a build-time proxy; the
      # authoritative RUNTIME check is `python -m config.omp_smoke` after the bindings build.)
      # NOTE: no `set -o pipefail` + `grep -q` here — that combo SIGPIPEs the upstream
      # command and false-fails a GOOD build (the 2026-07-30 self-inflicted bug). The clean
      # discriminator is simply: a serial OpenFHE (WITH_OPENMP=OFF) links no libgomp.
      ansible.builtin.shell: |
        set -eu
        lib=$(ls /usr/local/lib/libOPENFHEpke.so 2>/dev/null | head -1)
        test -n "$lib" || { echo "libOPENFHEpke not found"; exit 1; }
        if ldd "$lib" | grep -qiE 'libgomp|libomp'; then
          echo "OpenMP linked: $(ldd "$lib" | grep -iE 'libgomp|libomp' | tr -s ' ')"
        else
          echo "SERIAL BUILD: OpenFHE links no OpenMP runtime (no libgomp/libomp)"; exit 1
        fi
      args:
        executable: /bin/bash
      changed_when: false

    - name: Ensure app directory exists
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: "0755"

    - name: Ensure models directory exists
      ansible.builtin.file:
        path: "{{ app_dir }}/models"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: "0755"

    - name: Create Python venv
      ansible.builtin.command:
        cmd: python3 -m venv {{ venv_dir }}
        creates: "{{ venv_dir }}/bin/activate"

    - name: Chown venv to ubuntu
      ansible.builtin.file:
        path: "{{ venv_dir }}"
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        recurse: true

    - name: Upgrade pip
      ansible.builtin.pip:
        name: ["pip", "wheel", "setuptools"]
        state: latest
        virtualenv: "{{ venv_dir }}"
      become_user: "{{ app_user }}"

    - name: Sync LSSVM source tree
      ansible.posix.synchronize:
        src: "{{ repo_root }}/"
        dest: "{{ app_dir }}/"
        delete: true
        rsync_path: "sudo rsync"
        # Exclude large or unnecessary directories and ensure ownership on remote
        rsync_opts:
          - "--exclude=__pycache__"
          - "--exclude=*.pyc"
          - "--exclude=infra"
          - "--exclude=.terraform"
          - "--exclude=build"
          - "--exclude=.git"
          - "--exclude=models"
          - "--exclude=venv"
      become: true
      tags: [sync, code]

    - name: Chown LSSVM source tree
      ansible.builtin.file:
        path: "{{ app_dir }}"
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        recurse: true
      become: true
      tags: [sync, code]

    - name: Copy requirements.txt
      ansible.builtin.copy:
        src: "{{ repo_root }}/requirements.txt"
        dest: "{{ app_dir }}/requirements.txt"
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: "0644"
      tags: [sync, code]

    - name: Install Python deps
      ansible.builtin.pip:
        requirements: "{{ app_dir }}/requirements.txt"
        virtualenv: "{{ venv_dir }}"
      become_user: "{{ app_user }}"

    # Real bindings live at github.com/openfheorg/openfhe-python — the PyPI
    # `openfhe` package is unrelated namesquat. Always build from source.
    - name: Uninstall stray PyPI 'openfhe' if present
      ansible.builtin.pip:
        name: openfhe
        state: absent
        virtualenv: "{{ venv_dir }}"
      become_user: "{{ app_user }}"
      failed_when: false

    - name: Install pybind11 (build dep for openfhe-python)
      ansible.builtin.pip:
        name: pybind11
        virtualenv: "{{ venv_dir }}"
      become_user: "{{ app_user }}"

    - name: Clone openfhe-python
      ansible.builtin.git:
        repo: https://github.com/openfheorg/openfhe-python.git
        dest: /opt/build/openfhe-python
        version: "{{ openfhe_python_version | default('main') }}"
        depth: 1
        force: true

    - name: Chown openfhe-python build dir
      ansible.builtin.file:
        path: /opt/build/openfhe-python
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        recurse: true

    # openfhe-python is cmake-only (no setup.py/pyproject.toml) — build .so manually,
    # then copy into the venv's site-packages.
    - name: Resolve pybind11 cmake dir
      ansible.builtin.command:
        cmd: "{{ venv_dir }}/bin/python -m pybind11 --cmakedir"
      register: pybind11_cmakedir
      changed_when: false
      become_user: "{{ app_user }}"

    - name: Configure openfhe-python build
      ansible.builtin.command:
        cmd: >
          cmake -S /opt/build/openfhe-python -B /opt/build/openfhe-python/build
          -DCMAKE_PREFIX_PATH=/usr/local;{{ pybind11_cmakedir.stdout }}
          -Dpybind11_DIR={{ pybind11_cmakedir.stdout }}
          -DPYTHON_EXECUTABLE={{ venv_dir }}/bin/python
        creates: /opt/build/openfhe-python/build/Makefile
      become_user: "{{ app_user }}"

    - name: Compile openfhe-python
      community.general.make:
        chdir: /opt/build/openfhe-python/build
        jobs: "{{ ansible_processor_vcpus | default(2) }}"
      become_user: "{{ app_user }}"

    - name: Locate built openfhe .so
      ansible.builtin.find:
        paths: /opt/build/openfhe-python/build
        patterns: "openfhe*.so"
      register: openfhe_so

    - name: Fail if .so missing
      ansible.builtin.assert:
        that: openfhe_so.files | length > 0
        fail_msg: "openfhe-python build produced no .so — check build logs"

    - name: Discover venv site-packages
      ansible.builtin.command:
        cmd: "{{ venv_dir }}/bin/python -c 'import sysconfig; print(sysconfig.get_paths()[\"purelib\"])'"
      register: site_packages
      changed_when: false

    - name: Install openfhe .so into venv site-packages
      ansible.builtin.copy:
        src: "{{ openfhe_so.files[0].path }}"
        dest: "{{ site_packages.stdout }}/{{ openfhe_so.files[0].path | basename }}"
        remote_src: true
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: "0644"

    - name: Drop run.sh helper
      ansible.builtin.copy:
        dest: "{{ app_dir }}/run.sh"
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: "0755"
        content: |
          #!/usr/bin/env bash
          # Usage: run.sh [module] [-k N] [--n-per-class=N] [--no-serialize] [args...]
          # Default: federated_lssvm.train. Threads default to nproc, override with
          # OMP_NUM_THREADS=N ./run.sh ... or pass --threads=N to the python module.
          # -k N            Number of federated clients (federated_lssvm.train only).
          # K env var also works: K=5 ./run.sh
          set -euo pipefail
          cd "{{ app_dir }}"
          source "{{ venv_dir }}/bin/activate"
          export PYTHONPATH="{{ app_dir }}:${PYTHONPATH:-}"
          export LD_LIBRARY_PATH=/usr/local/lib:${LD_LIBRARY_PATH:-}
          export OMP_NUM_THREADS=${OMP_NUM_THREADS:-$(nproc)}
          export OMP_PROC_BIND=${OMP_PROC_BIND:-spread}
          export OMP_PLACES=${OMP_PLACES:-cores}
          export OPENBLAS_NUM_THREADS=1
          export MKL_NUM_THREADS=1
          module="federated_lssvm.train"
          if [ $# -gt 0 ] && [[ "$1" != -* ]]; then
            module="$1"
            shift
          fi
          k_arg=()
          if [ -n "${K:-}" ]; then
            k_arg=("$K")
          fi
          passthrough=()
          while [ $# -gt 0 ]; do
            case "$1" in
              -k)
                k_arg=("$2"); shift 2;;
              -k=*|--k=*)
                k_arg=("${1#*=}"); shift;;
              *)
                passthrough+=("$1"); shift;;
            esac
          done
          PYTHON_BIN="{{ venv_dir }}/bin/python"
          if [ ! -x "$PYTHON_BIN" ]; then
            PYTHON_BIN="{{ venv_dir }}/bin/python3"
          fi
          exec "$PYTHON_BIN" -m "$module" "${k_arg[@]}" "${passthrough[@]}"
      tags: [run, code]

    - name: Verify OpenFHE parallelizes at RUNTIME (authoritative OpenMP gate)
      # Build-time symbol checks are only a proxy. This runs the real bootstrapping workload
      # and asserts it uses multiple cores (avg_cores >= 1.5 at 4 threads); exit 1 if OpenFHE
      # runs SERIAL on this host. ~1-3 min. Definitive guard against a serial campaign —
      # prints the actual cores so the ARM runtime behavior is on the record.
      become: true
      become_user: "{{ app_user }}"
      ansible.builtin.command:
        cmd: "{{ venv_dir }}/bin/python -m config.omp_smoke"
        chdir: "{{ app_dir }}"
      environment:
        OMP: "4"
        RING: "65536"
        PYTHONPATH: "{{ app_dir }}"
        LD_LIBRARY_PATH: /usr/local/lib
      changed_when: false
      register: omp_runtime
      tags: [campaign]

    - name: Show OpenMP runtime result
      ansible.builtin.debug:
        var: omp_runtime.stdout_lines
      tags: [campaign]

    - name: Ensure campaign results dir exists
      ansible.builtin.file:
        path: "{{ app_dir }}/campaign_results"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: "0755"
      tags: [campaign]

    - name: Drop lssvm-campaign systemd unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/lssvm-campaign.service
        mode: "0644"
        content: |
          [Unit]
          Description=FHE LSSVM full metrics campaign (pytest + iris/breast_cancer sweep)
          After=network-online.target
          Wants=network-online.target

          [Service]
          # Type=simple: `systemctl start` returns as soon as the script forks, so the
          # ansible task (and therefore terraform apply) does NOT block on the long run.
          Type=simple
          User={{ app_user }}
          Group={{ app_group }}
          WorkingDirectory={{ app_dir }}
          Environment=SECURITY=128
          ExecStart=/usr/bin/env bash {{ app_dir }}/config/run_campaign.sh
          StandardOutput=append:{{ app_dir }}/campaign_results/campaign.log
          StandardError=append:{{ app_dir }}/campaign_results/campaign.log

          [Install]
          WantedBy=multi-user.target
      tags: [campaign]

    - name: Enable + start the campaign in the background
      # state: started is idempotent — it will NOT restart an already-running campaign
      # on a re-apply. `enabled` makes it resume-safe across a reboot (the script skips
      # configs that already produced a report.md).
      ansible.builtin.systemd:
        name: lssvm-campaign
        daemon_reload: true
        enabled: true
        state: started
      tags: [campaign]
